name: Refresh profile artwork

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/profile.json"
      - "assets/**"
      - ".github/workflows/profile.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/profile.json"
      - "assets/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test data handling and artwork
        run: python -m unittest discover -s tests -v
      - name: Check reproducible SVGs
        run: python scripts/build_profile.py --check

  refresh:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch public repository data and render artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_profile.py --refresh
      - name: Validate refreshed artwork
        run: python -m unittest discover -s tests -v
      - name: Commit changed snapshot
        run: |
          git add -- data/profile.json assets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile snapshot"
          git push
