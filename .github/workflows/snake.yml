name: Generate Contribution Snake

on:
  # Keep the SVG fresh daily (00:30 UTC)
  schedule:
    - cron: "30 0 * * *"
  # Rebuild when the profile or this workflow changes
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Scheduled + push runs can overlap; only keep the latest
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: knightfang36
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
